# Workshop 定義ファイル (hull-terminal)
# リファレンス: https://ubuntu.com/workshop/docs/reference/definition-files/workshop-definition/
#
# - name はファイル名 (.workshop/<name>.yaml) と一致させる
# - base / sdks を変更したら `workshop refresh` で反映する
# - actions の変更は refresh 不要 (即時反映)
#
# hull-terminal のビルド要件: Rust。Wayland などのシステムライブラリは Phase 1 で足す

name: dev
base: ubuntu@24.04   # ubuntu@22.04 / 24.04 / 26.04

sdks:
  - name: rust

# `workshop run -- <action> [引数...]` で実行する名前付きスクリプト。
# bash (errexit + pipefail) で実行される。プロジェクトは /project にマウントされる。
# ソースがまだない段階でも失敗しないよう、Cargo.toml があるときだけ実行する。
actions:
  setup: |
    sudo apt-get update
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
      git build-essential pkg-config
    cd /project
    if [ -f Cargo.toml ]; then cargo fetch; fi

  build: |
    cd /project
    if [ -f Cargo.toml ]; then cargo build --workspace "$@"; fi

  test: |
    cd /project
    if [ -f Cargo.toml ]; then cargo test --workspace "$@"; fi

  lint: |
    cd /project
    if [ -f Cargo.toml ]; then cargo clippy --workspace --all-targets -- -D warnings; fi

  fmt: |
    cd /project
    if [ -f Cargo.toml ]; then cargo fmt --all; fi
