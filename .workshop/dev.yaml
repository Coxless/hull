# Workshop 定義ファイル (hull-terminal)
# リファレンス: https://ubuntu.com/workshop/docs/reference/definition-files/workshop-definition/
#
# - name はファイル名 (.workshop/<name>.yaml) と一致させる
# - base / sdks を変更したら `workshop refresh` で反映する
# - actions の変更は refresh 不要 (即時反映)
#
# hull-terminal のビルド要件: Rust と、Wayland・xkbcommon・fontconfig・EGL の開発用ライブラリ

name: dev
base: ubuntu@24.04   # ubuntu@22.04 / 24.04 / 26.04

sdks:
  - name: rust

# `workshop run -- <action> [引数...]` で実行する名前付きスクリプト。
# bash (errexit + pipefail) で実行される。プロジェクトは /project にマウントされる。
actions:
  setup: |
    sudo apt-get update
    sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
      git build-essential pkg-config \
      libwayland-dev libxkbcommon-dev libfontconfig-dev libegl-dev
    cd /project
    cargo fetch

  build: |
    cd /project
    cargo build --workspace "$@"

  test: |
    cd /project
    cargo test --workspace "$@"

  lint: |
    cd /project
    cargo clippy --workspace --all-targets -- -D warnings

  fmt: |
    cd /project
    cargo fmt --all

  deb: |
    cd /project
    scripts/build-deb.sh "$@"
