[package]
name = "hull"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hull-term.workspace = true
hull-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["static"] }
glow = "0.18"
swash = "0.2"
yeslogic-fontconfig-sys = "6"
memmap2 = "0.9"
libc = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
