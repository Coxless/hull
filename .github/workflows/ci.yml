name: CI

# GitHub Flow: 作業ブランチはプルリクエストで検査し、main はマージされた結果を検査する。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# プルリクエストでは、新しい push が来たら古い検査を止める。main の検査は最後まで走らせる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ジョブ名 "Ubuntu" は main のブランチ保護で必須の検査になっているので、変えない。
  build:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 作り直しの途中でコードがまだないあいだは、検査を飛ばす。
      - name: Rust の整形・clippy・ビルド・テスト
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml がまだないので、検査を飛ばします"
            exit 0
          fi
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build --workspace
          cargo test --workspace

  package:
    name: Package
    uses: ./.github/workflows/package.yml
