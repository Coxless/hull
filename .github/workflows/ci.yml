name: CI

# GitHub Flow: 作業ブランチはプルリクエストで検査し、main はマージされた結果を検査する。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# プルリクエストでは、新しい push が来たら古い検査を止める。main の検査は最後まで走らせる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ジョブ名 "Ubuntu" は main のブランチ保護で必須の検査になっているので、変えない。
  build:
    name: Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ビルドに要るライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libfontconfig-dev libegl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 整形
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: ビルド
        run: cargo build --workspace

      - name: テスト
        run: cargo test --workspace

  package:
    name: Package
    uses: ./.github/workflows/package.yml
