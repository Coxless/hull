# 配布パッケージ (Ubuntu の .deb と Windows のインストーラー) を作り、入れて起動できることを確かめる。
# CI (プルリクエストと main への push) とリリース (タグの push) の両方から呼ばれる。
name: Package

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: Ubuntu (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tauri の前提パッケージ
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: フロントの依存を入れる
        working-directory: app
        run: npm ci

      # デーモンをリリースビルドして同梱し、.deb にまとめる。
      - name: .deb を作る
        working-directory: app
        run: npm run bundle -- --bundles deb

      - name: 中身を表示する
        working-directory: target/release/bundle/deb
        run: |
          sha256sum *.deb
          dpkg --info *.deb

      # 作った .deb を実際に入れ、仮想ディスプレイで起動して bash までつながることを確かめる。
      - name: 入れて起動できるか確かめる
        run: |
          sudo apt-get install -y xvfb dbus-x11 ./target/release/bundle/deb/*.deb
          test -x /usr/bin/hull-terminal
          test -x /usr/bin/hull-terminal-daemon
          test -x /usr/bin/hull

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          # 短い名前の `hull` から起動する (中で hull-terminal に置き換わる)。
          dbus-run-session -- xvfb-run -a hull > "$RUNNER_TEMP/app.log" 2>&1 &

          # アプリがデーモンを起動し、デーモンが bash を起動するまで待つ。
          for _ in $(seq 1 60); do
            daemon=$(pgrep -x hull-terminal-d || true)
            if [ -n "$daemon" ] && pgrep -P "$daemon" -x bash > /dev/null; then
              echo "デーモン (PID $daemon) の下で bash が動いています"
              ok=1
              break
            fi
            sleep 0.5
          done
          if [ -z "${ok:-}" ]; then
            echo "::error::アプリを起動しても、デーモンと bash が動きませんでした"
            cat "$RUNNER_TEMP/app.log" || true
            cat "$XDG_RUNTIME_DIR/hull-terminal/daemon.log" || true
            exit 1
          fi

          # ウィンドウを閉じても (アプリを終了しても) デーモンと bash は残る。
          pkill -x hull-terminal
          sleep 2
          pgrep -x hull-terminal-d > /dev/null || { echo "::error::アプリを閉じたらデーモンも終了しました"; exit 1; }
          echo "アプリを閉じたあともデーモンは残っています"
          pkill -x hull-terminal-d

      - uses: actions/upload-artifact@v4
        with:
          name: hull-terminal-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: フロントの依存を入れる
        working-directory: app
        run: npm ci

      # デーモンをリリースビルドして同梱し、インストーラー (NSIS の setup.exe) にまとめる。
      - name: インストーラーを作る
        working-directory: app
        run: npm run bundle -- --bundles nsis

      - name: 中身を表示する
        shell: pwsh
        run: Get-FileHash target/release/bundle/nsis/*-setup.exe -Algorithm SHA256 | Format-List

      # 作ったインストーラーを実際に入れ、起動して bash までつながることを確かめる。
      - name: 入れて起動できるか確かめる
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # /S は画面を出さずに入れる指定。利用者ごとの場所 (%LOCALAPPDATA%) に入る。
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'hull-terminal'
          foreach ($name in 'hull-terminal.exe', 'hull-terminal-daemon.exe') {
            if (-not (Test-Path (Join-Path $dir $name))) {
              Get-ChildItem $dir -ErrorAction SilentlyContinue
              Write-Host "::error::$name が $dir に入っていません"
              exit 1
            }
          }

          Start-Process -FilePath (Join-Path $dir 'hull-terminal.exe')

          # アプリがデーモンを起動し、デーモンが bash を起動するまで待つ。
          $ok = $false
          foreach ($i in 1..120) {
            $daemon = Get-Process -Name hull-terminal-daemon -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($daemon) {
              $bash = Get-CimInstance Win32_Process -Filter "Name = 'bash.exe' AND ParentProcessId = $($daemon.Id)"
              if ($bash) {
                Write-Host "デーモン (PID $($daemon.Id)) の下で bash が動いています"
                $ok = $true
                break
              }
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ok) {
            Write-Host "::error::アプリを起動しても、デーモンと bash が動きませんでした"
            Get-Process | Where-Object { $_.Name -match 'hull|bash|msedgewebview2' } | Format-Table Id, Name
            Get-Content (Join-Path $env:TEMP 'hull-terminal\daemon.log') -ErrorAction SilentlyContinue
            exit 1
          }

          # アプリを終了しても、デーモンと bash は残る。
          Stop-Process -Name hull-terminal -Force
          Start-Sleep -Seconds 2
          if (-not (Get-Process -Name hull-terminal-daemon -ErrorAction SilentlyContinue)) {
            Write-Host "::error::アプリを閉じたらデーモンも終了しました"
            exit 1
          }
          Write-Host "アプリを閉じたあともデーモンは残っています"
          Stop-Process -Name hull-terminal-daemon -Force

      - uses: actions/upload-artifact@v4
        with:
          name: hull-terminal-windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
