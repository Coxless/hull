# Ubuntu 向けの配布パッケージ (.deb) を作る。CI から呼ばれる。
# ジョブ名 "Ubuntu (.deb)" は main のブランチ保護で必須の検査になっているので、変えない。
# 作り直しの途中で、まだパッケージにするものがない。Phase 1 で .deb を作る手順に戻す。
name: Package

on:
  workflow_call:

jobs:
  deb:
    name: Ubuntu (.deb)
    runs-on: ubuntu-24.04
    steps:
      - name: まだパッケージにするものがない
        run: echo "作り直しの途中なので、.deb は作りません"
