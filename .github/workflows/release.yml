# `v0.1.0` のようなタグを push すると、.deb と Windows のインストーラーを作って GitHub Releases に公開する。
#
#   git switch main && git pull
#   git tag v0.1.0 && git push origin v0.1.0
#
# タグは main にマージ済みのコミットに付ける。
# タグの版は Cargo.toml の [workspace.package] の version と同じにする。
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  version:
    name: 版の確認
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: タグが main のコミットに付いているか
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::タグ $GITHUB_REF_NAME のコミットが main にありません。プルリクエストを main にマージしてからタグを付けてください"
            exit 1
          fi
      - name: タグと Cargo.toml の版が合っているか
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Cargo.toml: $version / タグ: $GITHUB_REF_NAME"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME が Cargo.toml の版 $version と合いません"
            exit 1
          fi

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  publish:
    name: GitHub Releases に公開
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Ubuntu と Windows の成果物を1つのディレクトリに集める。
      - uses: actions/download-artifact@v4
        with:
          pattern: hull-terminal-*
          path: dist
          merge-multiple: true

      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.deb *.exe | tee SHA256SUMS)
          ls -la dist
          cat > notes.md <<NOTES
          ## インストール (Ubuntu 24.04 以降)

          \`\`\`bash
          gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY -p '*.deb'
          sudo apt install ./hull-terminal_${GITHUB_REF_NAME#v}_amd64.deb
          hull
          \`\`\`

          ## インストール (Windows 10 / 11)

          下の Assets から \`hull-terminal_${GITHUB_REF_NAME#v}_x64-setup.exe\` をダウンロードして実行します。
          先に [Git for Windows](https://gitforwindows.org/) を入れておいてください (Git Bash を使います)。

          インストーラーには署名がないので、実行時に Windows の警告 (SmartScreen) が出ます。
          Windows 版は CI で入れて起動できることだけを確かめており、実機での確認はまだです。

          ## ファイルの確認

          \`gh\` がなければ、下の Assets からダウンロードしてください。
          \`SHA256SUMS\` でファイルを確かめられます (\`sha256sum -c --ignore-missing SHA256SUMS\`)。
          NOTES
          # 0.x のうちはプレリリースとして出す。
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.exe dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "hull-terminal $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
