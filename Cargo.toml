[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Coxless/hull"

[workspace.dependencies]
hull-term = { path = "crates/term" }
hull-plugin = { path = "crates/plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# バイナリを小さく速くする (目標: strip したリリースビルドで 5MB 未満)。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
