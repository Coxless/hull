[workspace]
resolver = "2"
members = ["crates/protocol", "crates/daemon", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
hull-terminal-protocol = { path = "crates/protocol" }
interprocess = { version = "2.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = true
